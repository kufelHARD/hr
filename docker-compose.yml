# Uruchomienie: docker compose up -d   (aplikacja na http://localhost:3000)
services:
  porownywarka:
    build: .
    image: porownywarka-cv
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /app/storage
      DATABASE_URL: file:/app/storage/app.db
      BACKUP_DIR: /app/backups
      # darmowy model lokalny: Ollama zainstalowana na komputerze-gospodarzu
      OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # dane osobowe kandydatów (baza + pliki) – trwałe, poza kontenerem
      - ./storage:/app/storage
      # edytowalna konfiguracja i prompty
      - ./config:/app/config
      - ./prompts:/app/prompts
      # kopie zapasowe (npm run backup w kontenerze)
      - ./backups:/app/backups
