# Buduje wersję do pobrania dla Windows, testuje ją na Windows i publikuje jako GitHub Release.
# Uruchamia się: ręcznie (Actions → „Wersja Windows” → Run workflow) lub po wypchnięciu tagu v* (np. v1.0.0).
name: Wersja Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalacja zależności
        run: |
          npm ci --ignore-scripts
          npx prisma generate

      - name: Testy (Windows)
        run: npm test

      - name: Budowanie paczki
        run: node scripts/package-windows.mjs

      - name: Test startu paczki
        run: node scripts/smoke-test-package.mjs dist/Porownywarka-CV

      - name: Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: Porownywarka-CV-windows-x64
          path: dist/Porownywarka-CV-windows-x64.zip
          retention-days: 30

      - name: Publikacja (Release)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Porownywarka-CV-windows-x64.zip \
            --title "Porównywarka CV $GITHUB_REF_NAME (Windows)" \
            --notes-file launcher/RELEASE_NOTES.md
