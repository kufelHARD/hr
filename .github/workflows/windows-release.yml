# Buduje wersję do pobrania dla Windows, testuje ją na Windows i publikuje jako GitHub Release v<wersja>.
# Uruchamia się: ręcznie (Actions → „Wersja Windows” → Run workflow) albo automatycznie po zmianie
# pola "version" w package.json (lub tego pliku) na gałęzi main. Release powstaje tylko dla nowej wersji.
name: Wersja Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["package.json", ".github/workflows/windows-release.yml"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalacja zależności
        run: |
          npm ci --ignore-scripts
          npx prisma generate

      - name: Testy (Windows)
        run: npm test

      - name: Budowanie paczki
        run: node scripts/package-windows.mjs

      - name: Test startu paczki
        run: node scripts/smoke-test-package.mjs dist/Porownywarka-CV

      - name: Artefakt
        uses: actions/upload-artifact@v5
        with:
          name: Porownywarka-CV-windows-x64
          path: dist/Porownywarka-CV-windows-x64.zip
          retention-days: 30

      - name: Publikacja (Release v<wersja z package.json>)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION już istnieje – aktualizuję plik ZIP."
            gh release upload "$VERSION" dist/Porownywarka-CV-windows-x64.zip --clobber
          else
            gh release create "$VERSION" dist/Porownywarka-CV-windows-x64.zip \
              --target "$GITHUB_SHA" \
              --title "Porównywarka CV $VERSION (Windows)" \
              --notes-file launcher/RELEASE_NOTES.md
          fi
